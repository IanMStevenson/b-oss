# b-push — Cloudflare Worker config (notification-service.md). Static config only: nothing here
# is ever run automatically. Deploying this service is a deliberate, manual, one-time-per-change
# step the user performs themselves — see packages/b-mobile/RESUME.md and notification-service.md
# ("no automated deploy on push, at least initially"). No CI job in this repo invokes `wrangler`.
#
# Live setup (b-oss#148): a dedicated Cloudflare account, separate from any personal one. The
# account_id and database_id below are identifiers, not secrets, so they are committed.
#   - D1 database `b-push` was created in the dashboard and src/schema.sql run in its Console.
#   - Deploys use a scoped API token (Workers Scripts: Edit, D1: Edit, Account Settings: Read,
#     limited to this account), never `wrangler login`:
#       read -rs CLOUDFLARE_API_TOKEN && export CLOUDFLARE_API_TOKEN
#       npx wrangler@4.148.0 deploy
#   - The three secrets are set on the Worker in the dashboard (Settings -> Variables and
#     Secrets, type Secret); `wrangler deploy` leaves them in place:
#       READ_TOKEN_ENCRYPTION_KEY  32 random bytes, base64
#       REGISTRATION_SECRET        must match the app build's VITE_NOTIFY_REGISTRATION_SECRET
#       FCM_SERVICE_ACCOUNT_JSON   the Firebase service-account key file's contents
#   - The workers.dev URL `wrangler deploy` prints goes in VITE_NOTIFY_SERVICE_URL.

name = "b-push"
account_id = "ec00647e37de5f36fc3d5a7aac03ded2"
main = "src/index.ts"
compatibility_date = "2026-08-04"

[[d1_databases]]
binding = "DB"
database_name = "b-push"
database_id = "a4d5a30b-c9ee-45e0-8b38-fbd3921a295e"

# Two independent cron triggers (notification-service.md "Polling design" / "Preference
# freshness"): a 1-minute activity poll (counts-only, per due registration) and an hourly
# cached-push-prefs refresh. Both run inside the same scheduled() handler, which reads
# event.cron to tell them apart (src/index.ts).
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

# Workers Logs (b-oss#238): keeps the [b-push] console lines (tick summaries, per-registration
# failures, unhandled route errors) so they can be read after the fact, not only live via
# `wrangler tail`. Nothing logged includes a token or a request body (src/log.ts).
[observability]
enabled = true
