apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Release versioning (docs/RELEASING-android.md). versionName is the b-mobile package.json version;
// versionCode must rise on every Play upload, so it is the commit count (monotonic on the
// integration branch, no manual bump). BMOBILE_VERSION_CODE overrides it, e.g. to re-upload a
// build of an already-used commit.
def appVersionName = new JsonSlurper().parse(file('../../package.json')).version
def appVersionCode = (System.getenv('BMOBILE_VERSION_CODE') ?: providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
    workingDir = rootDir
}.standardOutput.asText.get().trim()).toInteger()

// Upload-key signing. Values come from the environment or ~/.gradle/gradle.properties, never from
// the repo. Absent, `bundleRelease` still builds, unsigned, so CI and other machines don't break.
def uploadProp = { String name -> System.getenv(name) ?: project.findProperty(name) }
def uploadStoreFile = uploadProp('BMOBILE_UPLOAD_STORE_FILE')

android {
    namespace = "uk.co.salientpoint.bmobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uk.co.salientpoint.bmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadStoreFile) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadProp('BMOBILE_UPLOAD_STORE_PASSWORD')
                keyAlias uploadProp('BMOBILE_UPLOAD_KEY_ALIAS')
                keyPassword uploadProp('BMOBILE_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Writes build/native-licences.json: every external artifact on the release runtime classpath
// with the licence(s) its POM declares (falling back to parent POMs) and any NOTICE file it ships. Consumed by
// scripts/native-licences.mjs, which produces the in-app list. Run via `npm run licences:native`.
import groovy.json.JsonOutput
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

tasks.register('nativeLicencesReport') {
    def outFile = layout.buildDirectory.file('native-licences.json')
    outputs.file(outFile)
    outputs.upToDateWhen { false }
    doLast {
        def ids = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.id }
            .findAll { it instanceof ModuleComponentIdentifier }
            .unique { it.displayName }
        def poms = dependencies.createArtifactResolutionQuery()
            .forComponents(ids)
            .withArtifacts(MavenModule, MavenPomArtifact)
            .execute()
        def pomFiles = [:]
        poms.resolvedComponents.each { c ->
            c.getArtifacts(MavenPomArtifact).each { a ->
                if (a instanceof ResolvedArtifactResult) pomFiles[c.id.displayName] = a.file
            }
        }
        def parser = new XmlSlurper(false, false)
        // Licences declared by the POM, or by the nearest ancestor POM that declares any.
        def licencesOf
        licencesOf = { File pom, int depth ->
            def xml = parser.parse(pom)
            def found = xml.licenses.license.collect {
                [name: it.name.text().trim(), url: it.url.text().trim()]
            }
            if (found || depth > 5 || !xml.parent.artifactId.text()) return found
            def p = xml.parent
            def parentId = "${p.groupId.text()}:${p.artifactId.text()}:${p.version.text()}".toString()
            def parentPom = pomFiles[parentId] ?: resolveParentPom(p.groupId.text(), p.artifactId.text(), p.version.text())
            parentPom ? licencesOf(parentPom, depth + 1) : found
        }
        // NOTICE files shipped inside the artifacts (jar or aar). Apache-2.0 section 4(d) asks that
        // they're reproduced. Keyed by component, one { path, text } per file found.
        def noticeRe = ~/(?i)^(META-INF\/)?(NOTICE|NOTICE\.txt|NOTICE\.md)$/
        def notices = [:].withDefault { [] }
        ['aar', 'jar'].each { type ->
            configurations.releaseRuntimeClasspath.incoming.artifactView {
                lenient = true
                attributes { attribute(Attribute.of('artifactType', String), type) }
            }.artifacts.each { a ->
                def cid = a.id.componentIdentifier
                if (!(cid instanceof ModuleComponentIdentifier)) return
                def visit
                visit = { InputStream stream ->
                    def zin = new java.util.zip.ZipInputStream(stream)
                    def e
                    while ((e = zin.nextEntry) != null) {
                        if (noticeRe.matcher(e.name).matches()) {
                            notices[cid.displayName] << [path: e.name, text: new String(zin.readAllBytes(), 'UTF-8').trim()]
                        } else if (type == 'aar' && e.name == 'classes.jar') {
                            visit(new ByteArrayInputStream(zin.readAllBytes()))
                        }
                    }
                }
                a.file.withInputStream { visit(it) }
            }
        }
        def entries = ids.collect { id ->
            def pom = pomFiles[id.displayName]
            [group: id.group, name: id.module, version: id.version,
             licences: pom ? licencesOf(pom, 0) : [],
             notices: notices.containsKey(id.displayName) ? notices[id.displayName].unique() : []]
        }.sort { a, b -> a.group <=> b.group ?: a.name <=> b.name }
        outFile.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(entries))
    }
}

// A parent POM that isn't itself on the classpath (e.g. a company-wide parent) still has to be
// fetched through the same repositories to read its licence.
def resolveParentPom(String group, String artifact, String version) {
    def detached = configurations.detachedConfiguration(
        dependencies.create("${group}:${artifact}:${version}@pom"))
    detached.transitive = false
    try { return detached.singleFile } catch (Exception ignored) { return null }
}
