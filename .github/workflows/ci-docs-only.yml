name: CI (site-only)

# Companion to ci.yml. ci.yml skips packages/b-site/** via paths-ignore, so a site-only PR
# never reports the 'ci' status check that the main ruleset requires. This
# workflow reports a passing 'ci' for exactly those PRs. Keep the paths and the
# job name in sync with ci.yml. See b-oss#381.

on:
  pull_request:
    branches: [main, integration/b-mobile-pc]
    paths:
      - 'packages/b-site/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "site-only change, nothing to build"
