name: CI (docs-only)

# Companion to ci.yml. ci.yml skips docs/** via paths-ignore, so a docs-only PR
# never reports the 'ci' status check that the main ruleset requires. This
# workflow reports a passing 'ci' for exactly those PRs. Keep the paths and the
# job name in sync with ci.yml. See b-oss#381.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change, nothing to build"
