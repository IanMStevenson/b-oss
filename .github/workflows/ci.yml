name: CI

# Pushes and pull requests only run the checks for the packages the change can affect (the changed
# packages plus everything that depends on them); scripts/ci-scope.mjs decides which. Changes the
# dependency graph cannot reason about (root config, lockfile, ...) run everything, as does a push
# whose previous commit is unavailable. The final `ci` job is the status check the main ruleset
# requires, so keep its name. See b-oss#557.
#
# Electron's binary download is skipped (ELECTRON_SKIP_BINARY_DOWNLOAD) except where the tests of
# packages/b-ark, which load the real electron package, are in scope.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/b-site/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'packages/b-site/**'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - id: plan
        run: node scripts/ci-scope.mjs plan --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  typecheck:
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/ci-scope.mjs run typecheck --packages "$PACKAGES"
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}

  lint:
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/ci-scope.mjs run lint --packages "$PACKAGES"
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}

  test:
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      # The Electron binary comes from github.com, which returned 504/502 repeatedly in b-oss#967.
      # Cache it (so one good download serves later runs) and retry the install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-win32-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win32-
      - name: npm ci (with retries)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $i), retrying"; sleep $((i * 20))
          done
          exit 1
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ contains(format(',{0},', needs.plan.outputs.packages), ',b-ark,') && '0' || '1' }}
      - run: node scripts/ci-scope.mjs run test --packages "$PACKAGES"
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}

  # The required status check. Skipped jobs (nothing affected) count as passing; failed or
  # cancelled ones do not.
  ci:
    needs: [plan, typecheck, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled."
          exit 1
      - run: echo "ci passed"
