name: CI

on:
  push:
    # b-mobile-initial is the long-lived integration branch for the Android app, merged to main only
    # when releasable — so it needs the same gate main has (typecheck, lint, tests) on every PR into it.
    branches: [main, develop, b-mobile-initial]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, b-mobile-initial]
    paths-ignore:
      - 'docs/**'

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
