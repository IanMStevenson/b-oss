name: Add to IS-Dev

on:
  issues:
    types: [opened]

permissions: {} # the job authenticates with PROJECT_TOKEN, not GITHUB_TOKEN

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/IanMStevensonDev/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
